<title>Viernes - Panel</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #111827;
        color: #f3f4f6;
    }

    .contenedor {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px;

    header {
        margin-bottom: 20px;

    .tarjeta {
        background: #1f2937;

    .tarjeta h2 {

    .estado-valor {

    .chat {
        background: #1f2937;

    .chat-header {

    #mensajes {
        height: 500px;

    .mensaje {

        font-size: 12px;

    .entrada {
        display: flex;
        gap: 10px;

    #entrada {
        flex: 1;

</div>

<script>

    const mensajes = [];

    const zonaMensajes =
        document.getElementById("mensajes");

    const entrada =
        document.getElementById("entrada");

    const botonEnviar =
        document.getElementById("enviar");

    function mostrarMensaje(rol, contenido) {

        const bloque =
            document.createElement("div");

        bloque.className =
            "mensaje " +
            (rol === "user"
                ? "usuario"
                : "viernes");

        const etiqueta =
            document.createElement("div");

        etiqueta.className = "etiqueta";

        etiqueta.textContent =
            rol === "user"
                ? "TÚ"
                : "VIERNES";

        const texto =
            document.createElement("div");

        texto.textContent = contenido;

        bloque.appendChild(etiqueta);
        bloque.appendChild(texto);

        zonaMensajes.appendChild(bloque);

        zonaMensajes.scrollTop =
            zonaMensajes.scrollHeight;
    }

    async function comprobarEstado() {

        try {

            const respuesta =
                await fetch("/api/status");

            if (!respuesta.ok) {
                throw new Error(
                    "HTTP " + respuesta.status
                );
            }

            const datos =
                await respuesta.json();

            document.getElementById(
                "estado-controlador"
            ).textContent = "ACTIVO";

            document.getElementById(
                "estado-viernes"
            ).textContent = "ACTIVO";

        }
        catch (error) {

            document.getElementById(
                "estado-controlador"
            ).textContent = "ERROR";

            document.getElementById(
                "estado-viernes"
            ).textContent = "NO DISPONIBLE";
        }
    }

    async function enviarMensaje() {

        const contenido =
            entrada.value.trim();

        if (!contenido) {
            return;
        }

        botonEnviar.disabled = true;

        mensajes.push({
            role: "user",
            content: contenido
        });

        mostrarMensaje(
            "user",
            contenido
        );

        entrada.value = "";

        try {

            const respuesta =
                await fetch(
                    "/api/chat",
                    {
                        method: "POST",

                        headers: {
                            "Content-Type":
                                "application/json; charset=utf-8"
                        },

                        body: JSON.stringify({
                            mensajes: [
                                {
                                    role: "user",
                                    content: contenido
                                }
                            ]
                        })
                    }
                );

            const datos =
                await respuesta.json();

            if (!respuesta.ok) {

                throw new Error(
                    datos.error ||
                    "Error HTTP " +
                    respuesta.status
                );
            }

            const respuestaViernes =
                datos.respuesta;

            mensajes.push({
                role: "assistant",
                content: respuestaViernes
            });

            mostrarMensaje(
                "assistant",
                respuestaViernes
            );

        }
        catch (error) {

            mostrarMensaje(
                "assistant",
                "ERROR: " + error.message
            );
        }

        finally {

            botonEnviar.disabled = false;

            entrada.focus();
        }
    }

    botonEnviar.addEventListener(
        "click",
        enviarMensaje
    );

    entrada.addEventListener(
        "keydown",
        function(evento) {

            if (
                evento.key === "Enter" &&
                !evento.shiftKey
            ) {

                evento.preventDefault();

                enviarMensaje();
            }
        }
    );

    comprobarEstado();

</script>

</body>
</html>
